[project]
name = "graphrisk-agent"
version = "0.1.0"
description = "Evidence-grounded fraud investigation agent portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
graphrisk-build-features = "graphrisk.pipeline:main"
graphrisk-generate-synthetic = "graphrisk.data.synthetic:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrisk"]
