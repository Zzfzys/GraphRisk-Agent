[project]
name = "enterprise-graphrag"
version = "0.1.0"
description = "Independent, source-grounded simulated IT knowledge assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_graphrag"]

[tool.uv]
cache-dir = ".uv-cache"
