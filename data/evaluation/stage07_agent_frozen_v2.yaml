- id: pending_restart_recovers
  mechanism: restart_pending_checkpoint
  basis: observed_stage06_gap
  trigger: Create pending, stop API, start a new process, GET the same run.
  input:
    request:
      transaction_id: T3
      dataset_source: synthetic
      policy_as_of: '2026-07-01'
      relation_limit: 3
    fault:
      kind: restart_after_pending
  expected_tool: GET /api/v1/investigations/{run_id}
  expected_parameters:
    run_id: $created_run_id
  expected_evidence: &id001
    transaction: ok
    risk_model: ok
    graph: ok
    policy: ok
  expected_policy_chunks:
  - policy-97f6eb79d2a992d3cc2fd187
  expected_response:
    http_status: 200
    branch: verified
    approval: pending
    error_code: null
  invariants:
  - same_run_id
  - stable_report_hash
  - no_external_action
- id: decision_retry_after_lost_response
