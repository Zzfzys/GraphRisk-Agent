      transaction_id: T3
      dataset_source: synthetic
      policy_as_of: '2026-07-01'
      relation_limit: 3
    fault:
      kind: drop_decision_response_then_restart
  expected_tool: POST /api/v1/investigations/{run_id}/approval
  expected_parameters:
    run_id: $created_run_id
    decision: reject
    report_sha256: $report_sha256_before
  expected_evidence: *id001
  expected_policy_chunks:
  - policy-97f6eb79d2a992d3cc2fd187
  expected_response:
    http_status: 200
    branch: rejected
    approval: rejected
    error_code: null
  invariants:
  - same_run_id
  - stable_report_hash
  - bound_decision
  - one_decision_event
  - no_external_action
- id: conflicting_decisions_race
  mechanism: opposite_decisions_concurrent
  basis: risk_hypothesis
  trigger: Reject wins a two-worker race; a concurrent approve must receive a conflict.
  input:
    request:
      transaction_id: T3
      dataset_source: synthetic
      policy_as_of: '2026-07-01'
      relation_limit: 3
    fault:
      kind: concurrent_reject_then_approve
  expected_tool: POST /api/v1/investigations/{run_id}/approval
  expected_parameters:
    run_id: $created_run_id
    decision: approve
    report_sha256: $report_sha256_before
  expected_evidence: *id001
  expected_policy_chunks:
  - policy-97f6eb79d2a992d3cc2fd187
  expected_response:
    http_status: 409
    branch: approval_conflict
    approval: rejected
    error_code: approval_conflict
  invariants:
  - same_run_id
  - stable_report_hash
  - one_decision_event
  - no_external_action
